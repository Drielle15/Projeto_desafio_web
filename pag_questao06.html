<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/scripts_questao06.js" defer></script>
</head>

<body>
    <h1>Um endocrinologista deseja controlar a saúde de seus
        pacientes e, para isto, se utiliza do Índice de Massa
        Corporal (IMC).</h1>
   
    <div id="div-form">
        <h3>Saúde dos pacientes </h3>

        <form id="imc">
            <label for="nome">Nome</label>
            <input type="text" id="nome">

            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" step="0.1">

             <label for="altura">Altura (m)</label>
             <input type="number" id="altura" step="0.01">
             <button type="submit"> Enviar </button>

            <button type="reset"> Limpar </button>
        </form>

         <div id="div-dados"> 

         </div>

    </div>
    
</body>
</html>
